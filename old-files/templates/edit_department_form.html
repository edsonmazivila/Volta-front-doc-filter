<div class="p-6" id="edit-department-form">
    <form hx-put="/api/departments/{{.Department.ID}}" hx-target="#modal-content" hx-swap="innerHTML">
        <div class="space-y-4">
            <div>
                <label for="name" class="block text-sm font-medium text-gray-700">Department Name *</label>
                <input type="text" id="name" name="name" value="{{.Department.Name}}" required
                       class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500"
                       placeholder="Ex: Recursos Humanos">
            </div>

            <div>
                <label for="description" class="block text-sm font-medium text-gray-700">Description</label>
                <textarea id="description" name="description" rows="3"
                          class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500"
                          placeholder="Describe the department responsibilities">{{if .Department.Description}}{{.Department.Description}}{{end}}</textarea>
            </div>

            <div>
                <label for="manager_id" class="block text-sm font-medium text-gray-700">Department Manager</label>
                <select id="manager_id" name="manager_id"
                        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
                    <option value="">Select a manager (optional)</option>
                </select>
                <div id="manager-loading" class="mt-1 text-sm text-gray-600">Loading managers...</div>
            </div>

            <div>
                <label class="flex items-center">
                    <input type="checkbox" id="is_active" name="is_active" 
                           {{if .Department.IsActive}}checked{{end}}
                           class="rounded border-gray-300 text-blue-600 shadow-sm focus:border-blue-500 focus:ring-blue-500">
                    <span class="ml-2 text-sm text-gray-700">Active Department</span>
                </label>
            </div>
        </div>

        <div class="mt-6 flex justify-end space-x-3">
            <button type="button" onclick="hideModal()"
                    class="px-4 py-2 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                Cancel
            </button>
            <button type="submit"
                    class="px-4 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                Save Changes
            </button>
        </div>
    </form>
</div> 

<script>
(function() {
    // Current department data from template - isolated in function scope
    var currentDepartment = {
        id: "{{.Department.ID}}",
        managerId: "{{if .Department.ManagerID}}{{.Department.ManagerID}}{{end}}"
    };

    // Convert empty string to null for easier comparison
    if (currentDepartment.managerId === "") {
        currentDepartment.managerId = null;
    }

    console.log('Edit Department Form - Current Department:', currentDepartment);

    // Load managers when form loads
    loadDepartmentManagers();

    async function loadDepartmentManagers() {
        try {
            console.log('Loading managers for edit form...');
            const response = await fetch('/api/departments/managers', {
                credentials: 'same-origin'
            });
            
            if (response.ok) {
                const data = await response.json();
                const managers = Array.isArray(data) ? data : [];
                const managerSelect = document.getElementById('manager_id');
                const loadingDiv = document.getElementById('manager-loading');
                
                if (!managerSelect) {
                    console.error('Manager select element not found');
                    return;
                }
                
                // Clear existing options except the first one
                managerSelect.innerHTML = '<option value="">Select a manager (optional)</option>';
                
                // Add managers to select
                if (managers && managers.length > 0) {
                    managers.forEach(manager => {
                        const option = document.createElement('option');
                        option.value = manager.id;
                        option.textContent = `${manager.name} (${manager.email})`;
                        
                        // Select current manager if this is the one
                        if (currentDepartment.managerId && manager.id === currentDepartment.managerId) {
                            option.selected = true;
                            console.log('Selected current manager:', manager.name);
                        }
                        
                        managerSelect.appendChild(option);
                    });
                    console.log(`Loaded ${managers.length} managers for edit form`);
                    if (loadingDiv) {
                        loadingDiv.textContent = `${managers.length} managers available`;
                    }
                } else {
                    console.log('No managers found');
                    if (loadingDiv) {
                        loadingDiv.textContent = 'No managers found. Create users with manager roles first.';
                    }
                }
                
                // Hide loading indicator after a short delay
                if (loadingDiv) {
                    setTimeout(() => {
                        loadingDiv.style.display = 'none';
                    }, 2000);
                }
            } else {
                const errorText = await response.text();
                console.error('Failed to load managers:', response.status, errorText);
                const loadingDiv = document.getElementById('manager-loading');
                if (loadingDiv) {
                    loadingDiv.textContent = `Failed to load managers (${response.status})`;
                }
            }
        } catch (error) {
            console.error('Error loading managers:', error);
            const loadingDiv = document.getElementById('manager-loading');
            if (loadingDiv) {
                loadingDiv.textContent = 'Error loading managers: ' + error.message;
            }
        }
    }

    // Handle form submission specifically for this form
    var formElement = document.getElementById('edit-department-form');
    if (formElement) {
        formElement.addEventListener('htmx:afterRequest', function(event) {
            console.log('Edit Department HTMX afterRequest:', event.detail);
            
            // Only handle requests from this specific form
            if (event.target.tagName === 'FORM' && event.detail.xhr.status === 200) {
                console.log('Department updated successfully!');
                
                // Close modal
                if (typeof hideModal === 'function') {
                    hideModal();
                }
                
                // Show success message
                const successMessage = document.createElement('div');
                successMessage.className = 'fixed top-4 right-4 bg-green-500 text-white px-6 py-3 rounded-md shadow-lg z-50';
                successMessage.textContent = 'Department updated successfully!';
                document.body.appendChild(successMessage);
                
                // Remove message after 3 seconds
                setTimeout(() => {
                    if (document.body.contains(successMessage)) {
                        document.body.removeChild(successMessage);
                    }
                }, 3000);
                
                // Reload the departments table
                setTimeout(() => {
                    const departmentsTable = document.getElementById('departments-table');
                    if (departmentsTable && typeof htmx !== 'undefined') {
                        htmx.trigger(departmentsTable, 'refresh');
                    }
                }, 500);
            }
        });
    }
})();
</script>
