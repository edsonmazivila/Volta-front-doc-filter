<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - NexuPayroll</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/static/js/rbac.js"></script>
    {{template "partials/jech-colors.html" .}}
    <link rel="stylesheet" href="/static/css/custom.css">
</head>
<body class="h-full bg-gray-100">
    <div id="app" class="min-h-full">
        {{template "partials/nav.html" .}}
        <div class="md:pl-64 relative z-0">
            <main id="main-content" class="mt-5 container mx-auto px-4">
                <section class="mb-8">
                    <h2 class="text-2xl font-bold text-jech-dark mb-3">Dashboard Overview</h2>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div class="elevated-card bg-white p-6 rounded-xl shadow-sm border border-gray-200 relative">
                            <h3 class="text-lg font-semibold text-jech-dark mb-2">Total Employees</h3>
                            <div class="kpi-value text-3xl md:text-4xl font-bold text-jech-accent" id="employee-count">
                                <div class="loading-placeholder">
                                    <div class="spinner spinner-sm"></div>
                                </div>
                            </div>
                        </div>
                        <div class="elevated-card bg-white p-6 rounded-xl shadow-sm border border-gray-200 relative">
                            <h3 class="text-lg font-semibold text-jech-dark mb-2">Pending Timesheets</h3>
                            <div class="kpi-value text-3xl md:text-4xl font-bold text-orange-600" id="pending-timesheets">
                                <div class="loading-placeholder">
                                    <div class="spinner spinner-sm"></div>
                                </div>
                            </div>
                        </div>
                        <div class="elevated-card bg-white p-6 rounded-xl shadow-sm border border-gray-200 relative">
                            <div class="flex items-center justify-between mb-2">
                                <h3 class="text-lg font-semibold text-jech-dark">Monthly Payroll</h3>
                                <button id="privacy-toggle" onclick="togglePrivacyMode()" 
                                        class="p-1.5 rounded-lg text-gray-400 hover:text-gray-600 hover:bg-gray-100 transition-colors"
                                        title="Toggle privacy mode for sensitive data">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                                    </svg>
                                </button>
                            </div>
                            <div class="kpi-value text-3xl md:text-4xl font-bold text-green-600 transition-all duration-300" id="monthly-payroll">
                                <div class="loading-placeholder">
                                    <div class="spinner spinner-sm"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>

                <section>
                    <h2 class="text-2xl font-bold text-jech-dark mb-3">Quick Actions</h2>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div class="flex flex-col elevated-card bg-white rounded-xl p-6 shadow-sm border border-gray-200">
                            <span class="text-body font-semibold mb-2 text-jech-dark">Add Employee</span>
                            <button type="button" aria-label="Add Employee"
                                    class="mt-auto btn btn-primary w-full"
                                    hx-get="/employees/new-with-user" hx-target="#main-content">
                                Execute
                            </button>
                        </div>
                        <div class="flex flex-col elevated-card bg-white rounded-xl p-6 shadow-sm border border-gray-200">
                            <span class="text-body font-semibold mb-2 text-jech-dark">Create Timesheet</span>
                            <button type="button" aria-label="Create Timesheet"
                                    class="mt-auto btn btn-primary w-full"
                                    hx-get="/timesheets/new" hx-target="#main-content">
                                Execute
                            </button>
                        </div>
                        <div class="flex flex-col elevated-card bg-white rounded-xl p-6 shadow-sm border border-gray-200">
                            <span class="text-body font-semibold mb-2 text-jech-dark">Run Payroll</span>
                            <button type="button" aria-label="Run Payroll"
                                    class="mt-auto btn btn-primary w-full"
                                    onclick="runPayroll()">
                                Execute
                            </button>
                        </div>
                    </div>
                </section>
            </main>
        </div>
    </div>
    <script src="/static/js/htmx.min.js"></script>
    <script src="/static/js/nav-dropdown.js"></script>
    <script src="/static/js/dashboard.js"></script>
</body>
</html>
