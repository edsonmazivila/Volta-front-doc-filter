{{define "attendance_list.html"}}
<div class="overflow-x-auto">
  <div class="mb-3 text-sm text-gray-600">Month: {{.Month}}</div>
  <table class="min-w-full text-left">
    <thead>
      <tr class="text-xs uppercase text-gray-500">
        <th class="px-4 py-2">Employee</th>
        <th class="px-4 py-2">Present</th>
        <th class="px-4 py-2">Justified</th>
        <th class="px-4 py-2">Absent</th>
        <th class="px-4 py-2">Actions</th>
      </tr>
    </thead>
    <tbody>
      {{if not .Rows}}
      <tr><td class="px-4 py-6 text-center text-sm text-gray-500" colspan="5">No records</td></tr>
      {{else}}
      {{range .Rows}}
      <tr>
        <td class="px-4 py-3 text-sm text-gray-700">{{.name}}</td>
        <td class="px-4 py-3 text-sm text-gray-700">{{.present}}</td>
        <td class="px-4 py-3 text-sm text-gray-700">{{.justified}}</td>
        <td class="px-4 py-3 text-sm text-gray-700">{{.absent}}</td>
        <td class="px-4 py-3 text-right">
          <a href="/api/attendance/report?month={{$.Month}}&userId={{.user_id}}" class="btn btn-secondary text-xs px-2 py-1 rounded-md border border-gray-300 hover:bg-gray-50">Export CSV</a>
        </td>
      </tr>
      {{end}}
      {{end}}
    </tbody>
  </table>
</div>
{{end}}
