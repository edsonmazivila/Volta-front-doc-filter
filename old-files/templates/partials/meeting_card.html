<div id="meeting_{{.ID}}" class="border border-gray-200 rounded-lg p-4 mb-3 bg-white">
  <div class="flex items-start justify-between">
    <div>
      <div class="text-sm text-gray-500">{{.DateTimeLocal}}{{if .Location}} • {{.Location}}{{end}}</div>
      <h4 class="text-base font-semibold text-gray-900">{{.Title}}</h4>
      {{if .Description}}<p class="text-sm text-gray-600 mt-1">{{.Description}}</p>{{end}}
      <div class="mt-2 text-xs text-gray-500">
        Organizer: <span class="font-medium">{{.OrganizerName}}</span>
      </div>
      <div class="mt-2 flex items-center gap-2">
        <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium
                     {{if eq .Status "scheduled"}}bg-blue-100 text-blue-800{{else if eq .Status "cancelled"}}bg-red-100 text-red-800{{else}}bg-gray-100 text-gray-800{{end}}">
          {{.Status}}
        </span>
      </div>
    </div>
    <div class="flex items-center gap-2 meeting-actions">
      {{if .IsOrganizer}}
        <button class="text-sm px-3 py-1.5 rounded-md border border-gray-300 hover:bg-gray-50"
                hx-get="/ui/meetings/{{.ID}}/edit"
                hx-target="#meetingFormHost"
                hx-swap="innerHTML">Edit</button>
        <button class="text-sm px-3 py-1.5 rounded-md border border-red-300 text-red-700 hover:bg-red-50"
                hx-delete="/api/meetings/{{.ID}}"
                hx-confirm="Cancel this meeting?"
                hx-target="body"
                hx-credentials="true"
                hx-swap="none">Cancel</button>
      {{else}}
        <button class="text-sm px-3 py-1.5 rounded-md bg-green-600 text-white hover:bg-green-700"
                hx-post="/api/meetings/{{.ID}}/respond"
                hx-vals='{"user_id":"{{$.User.ID}}","decision":"accept"}'
                hx-target="body"
                hx-credentials="true"
                hx-swap="none"
                hx-confirm="Accept this meeting?"
                hx-on:htmx:afterRequest="var c=this.closest('#meeting_{{.ID}}'); if(c){ var a=c.querySelector('.meeting-actions'); if(a){ a.innerHTML='\u003cspan class=\'text-sm px-2 py-1 rounded bg-green-50 text-green-700 border border-green-200\'\u003eAccepted\u003c/span\u003e'; } }">Accept</button>
        <button class="text-sm px-3 py-1.5 rounded-md bg-gray-100 text-gray-800 border border-gray-300 hover:bg-gray-200"
                hx-post="/api/meetings/{{.ID}}/respond"
                hx-vals='{"user_id":"{{$.User.ID}}","decision":"decline"}'
                hx-target="body"
                hx-credentials="true"
                hx-swap="none"
                hx-confirm="Decline this meeting?"
                hx-on:htmx:afterRequest="var c=this.closest('#meeting_{{.ID}}'); if(c){ var a=c.querySelector('.meeting-actions'); if(a){ a.innerHTML='\u003cspan class=\'text-sm px-2 py-1 rounded bg-gray-200 text-gray-800 border border-gray-300\'\u003eDeclined\u003c/span\u003e'; } }">Decline</button>
      {{end}}
    </div>
  </div>

  <div class="mt-3">
    <div class="text-xs text-gray-500 mb-1">Participants</div>
    <div class="flex flex-wrap gap-2">
      {{range .Participants}}
        <span class="inline-flex items-center gap-2 text-xs px-2 py-1 rounded border
                     {{if eq .status "accepted"}}bg-green-50 border-green-200 text-green-700
                     {{else if eq .status "declined"}}bg-red-50 border-red-200 text-red-700
                     {{else}}bg-gray-50 border-gray-200 text-gray-700{{end}}">
          <span class="inline-block w-1.5 h-1.5 rounded-full
                       {{if eq .status "accepted"}}bg-green-500{{else if eq .status "declined"}}bg-red-500{{else}}bg-gray-400{{end}}"></span>
          {{.name}}
        </span>
      {{end}}
    </div>
  </div>
</div>
