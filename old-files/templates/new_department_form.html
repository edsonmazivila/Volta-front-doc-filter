<div class="p-6">
    <form hx-post="/api/departments" hx-target="body" hx-swap="none" hx-on="htmx:afterRequest: if (event.detail && event.detail.elt === this && event.detail.xhr.status===201) { (window.hideModal && hideModal('modal')); window.location.href='/departments'; }">
        <div class="space-y-4">
            <div>
                <label for="name" class="block text-sm font-medium text-gray-700">Department Name *</label>
                <input type="text" id="name" name="name" required
                       class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500"
                       placeholder="Ex: Human Resources">
            </div>

            <div>
                <label for="description" class="block text-sm font-medium text-gray-700">Description</label>
                <textarea id="description" name="description" rows="3"
                          class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500"
                          placeholder="Describe the department responsibilities"></textarea>
            </div>

            <div>
                <label for="manager_id" class="block text-sm font-medium text-gray-700">Department Manager</label>
                <select id="manager_id" name="manager_id"
                        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
                    <option value="">Select a manager (optional)</option>
                    <!-- Managers will be loaded via JavaScript -->
                </select>
                <div id="manager-loading" class="mt-1 text-sm text-gray-500">Loading managers...</div>
            </div>
        </div>

        <div class="mt-6 flex justify-end space-x-3">
            <a href="/departments" hx-get="/departments" hx-target="#main-content" hx-select="main" hx-push-url="true" hx-swap="outerHTML" data-action="cancel" data-modal-id="modal"
               class="px-4 py-2 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                Cancel
            </a>
            <button type="submit"
                    class="px-4 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                Create Department
            </button>
        </div>
    </form>
</div>

<script>
console.log('Department form loaded');

// Load managers when form loads
loadDepartmentManagers();

async function loadDepartmentManagers() {
    try {
        const response = await fetch('/api/departments/managers', {
            credentials: 'same-origin'
        });
        
        if (response.ok) {
            const data = await response.json();
            const managers = Array.isArray(data) ? data : [];
            const managerSelect = document.getElementById('manager_id');
            const loadingDiv = document.getElementById('manager-loading');
            
            // Clear existing options except the first one
            managerSelect.innerHTML = '<option value="">Select a manager (optional)</option>';
            
            // Add managers to select
            if (managers && managers.length > 0) {
                managers.forEach(manager => {
                    const option = document.createElement('option');
                    option.value = manager.id;
                    option.textContent = `${manager.name} (${manager.email})`;
                    managerSelect.appendChild(option);
                });
                console.log(`Loaded ${managers.length} managers`);
                loadingDiv.textContent = `${managers.length} managers available`;
            } else {
                console.log('No managers found');
                loadingDiv.textContent = 'No managers found. Create users with manager roles (HR Manager, Payroll Manager, or Operational Manager) first.';
            }
            
            // Hide loading indicator after a short delay
            setTimeout(() => {
                loadingDiv.style.display = 'none';
            }, 2000);
        } else {
            const errorText = await response.text();
            console.error('Failed to load managers:', response.status, errorText);
            document.getElementById('manager-loading').textContent = `Failed to load managers (${response.status})`;
        }
    } catch (error) {
        console.error('Error loading managers:', error);
        document.getElementById('manager-loading').textContent = 'Error loading managers: ' + error.message;
    }
}

// Handle form submission
document.addEventListener('htmx:afterRequest', function(event) {
    console.log('HTMX afterRequest:', event.detail);
    
    // If successful (status 201 = Created)
    if (event.detail.xhr.status === 201) {
        console.log('Department created successfully!');
        
        // Close modal
        hideModal();
        
        // Show success message
        const successMessage = document.createElement('div');
        successMessage.className = 'fixed top-4 right-4 bg-green-500 text-white px-6 py-3 rounded-md shadow-lg z-50';
        successMessage.textContent = 'Department created successfully!';
        document.body.appendChild(successMessage);
        
        // Remove message after 3 seconds
        setTimeout(() => {
            if (document.body.contains(successMessage)) {
                document.body.removeChild(successMessage);
            }
        }, 3000);
        
        // Reload the departments table
        setTimeout(() => {
            const departmentsTable = document.getElementById('departments-table');
            if (departmentsTable) {
                htmx.ajax('GET', '/departments/table', {
                    target: '#departments-table', 
                    swap: 'innerHTML'
                });
            }
        }, 1000);
    }
    
    // If error
    if (event.detail.xhr.status >= 400) {
        console.log('Error creating department:', event.detail.xhr.responseText);
        
        // Show error message
        const errorMessage = document.createElement('div');
        errorMessage.className = 'fixed top-4 right-4 bg-red-500 text-white px-6 py-3 rounded-md shadow-lg z-50';
        errorMessage.textContent = 'Error creating department. Please try again.';
        document.body.appendChild(errorMessage);
        
        // Remove message after 5 seconds
        setTimeout(() => {
            if (document.body.contains(errorMessage)) {
                document.body.removeChild(errorMessage);
            }
        }, 5000);
    }
});
</script>
