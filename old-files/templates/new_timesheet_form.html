<form hx-post="/api/timesheets" hx-target="body" hx-swap="none" hx-on="htmx:afterRequest: if (event.detail && event.detail.elt === this && event.detail.xhr.status===201) { (window.hideModal && hideModal('modal')); window.location.href='/timesheets'; }">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div id="employee-select-wrapper">
            <label for="employee_id" class="block text-sm font-medium text-gray-700 mb-2">Employee</label>
            <select id="employee_id" name="employee_id" required 
                    class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-jech-accent">
                <option value="">Select Employee</option>
                {{range .Employees}}
                <option value="{{.ID}}">{{.FullName}}</option>
                {{end}}
            </select>
        </div>
        
        <div>
            <label for="pay_period_start" class="block text-sm font-medium text-gray-700 mb-2">Pay Period Start</label>
            <input type="date" id="pay_period_start" name="pay_period_start" required 
                   class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-jech-accent">
        </div>
        
        <div>
            <label for="pay_period_end" class="block text-sm font-medium text-gray-700 mb-2">Pay Period End</label>
            <input type="date" id="pay_period_end" name="pay_period_end" required 
                   class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-jech-accent">
        </div>
        
        <div>
            <label for="total_hours" class="block text-sm font-medium text-gray-700 mb-2">Total Hours</label>
            <input type="number" id="total_hours" name="total_hours" step="0.5" min="0" max="168" 
                   class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-jech-accent">
        </div>
        
        <div>
            <label for="regular_hours" class="block text-sm font-medium text-gray-700 mb-2">Regular Hours</label>
            <input type="number" id="regular_hours" name="regular_hours" step="0.5" min="0" max="168" 
                   class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-jech-accent">
        </div>
        
        <div>
            <label for="overtime_hours" class="block text-sm font-medium text-gray-700 mb-2">Overtime Hours</label>
            <input type="number" id="overtime_hours" name="overtime_hours" step="0.5" min="0" max="168" 
                   class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-jech-accent">
        </div>
        
        <div>
            <label for="status" class="block text-sm font-medium text-gray-700 mb-2">Status</label>
            <select id="status" name="status" required 
                    class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-jech-accent">
                <!-- Options will be populated by JavaScript based on user role -->
            </select>
        </div>
        
        <div class="md:col-span-2">
            <label for="notes" class="block text-sm font-medium text-gray-700 mb-2">Notes</label>
            <textarea id="notes" name="notes" rows="3" 
                      class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-jech-accent"></textarea>
        </div>
    </div>
    
    <div class="flex justify-end space-x-3 mt-6">
        <a href="/timesheets" hx-get="/timesheets" hx-target="#main-content" hx-select="main" hx-push-url="true" hx-swap="outerHTML" data-action="cancel" data-modal-id="modal"
           class="px-4 py-2 text-gray-700 bg-gray-200 rounded-md hover:bg-gray-300 transition-colors">
            Cancel
        </a>
        <button type="submit" 
                class="px-4 py-2 bg-jech-accent text-white rounded-md hover:bg-jech-blue transition-colors">
            Create Timesheet
        </button>
    </div>
</form>

<script>
console.log('Timesheet form loaded');

// Setup status options for new timesheet form
async function setupNewTimesheetStatusOptions() {
    try {
        const response = await fetch('/api/auth/profile', {
            credentials: 'same-origin'
        });
        
        if (response.ok) {
            const userData = await response.json();
            const userRole = userData.data.role;
            
            console.log('Setting up status options for new timesheet, role:', userRole);
            
            const statusSelect = document.getElementById('status');
            if (!statusSelect) {
                console.log('No status select found');
                return;
            }
            
            // Clear existing options
            statusSelect.innerHTML = '';
            
            // Define allowed statuses based on role
            let allowedStatuses = [];
            switch (userRole) {
                case 'admin':
                    allowedStatuses = [
                        { value: 'draft', label: 'Draft' },
                        { value: 'submitted', label: 'Submitted' },
                        { value: 'approved', label: 'Approved' },
                        { value: 'rejected', label: 'Rejected' }
                    ];
                    break;
                case 'manager':
                    allowedStatuses = [
                        { value: 'draft', label: 'Draft' },
                        { value: 'submitted', label: 'Submitted' },
                        { value: 'approved', label: 'Approved' },
                        { value: 'rejected', label: 'Rejected' }
                    ];
                    break;
                case 'employee':
                    allowedStatuses = [
                        { value: 'draft', label: 'Draft' },
                        { value: 'submitted', label: 'Submitted' }
                    ];
                    break;
                default:
                    allowedStatuses = [
                        { value: 'draft', label: 'Draft' },
                        { value: 'submitted', label: 'Submitted' }
                    ];
            }
            
            // Add options
            allowedStatuses.forEach(status => {
                const option = document.createElement('option');
                option.value = status.value;
                option.textContent = status.label;
                statusSelect.appendChild(option);
            });
            
            // Set default value
            if (allowedStatuses.length > 0) {
                statusSelect.value = allowedStatuses[0].value;
            }
            
            console.log('Status options set up successfully for new timesheet');
        }
    } catch (error) {
        console.error('Error setting up status options for new timesheet:', error);
    }
}

// Setup when form loads
setTimeout(() => {
    setupNewTimesheetStatusOptions();
}, 100);

// Handle form submission
document.addEventListener('htmx:afterRequest', function(event) {
    console.log('HTMX afterRequest:', event.detail);
    
    // If successful (status 201 = Created)
    if (event.detail.xhr.status === 201) {
        console.log('Timesheet created successfully!');
        
        // Close modal
        hideModal();
        
        // Show success message
        const successMessage = document.createElement('div');
        successMessage.className = 'fixed top-4 right-4 bg-green-500 text-white px-6 py-3 rounded-md shadow-lg z-50';
        successMessage.textContent = 'Timesheet created successfully!';
        document.body.appendChild(successMessage);
        
        // Remove message after 3 seconds
        setTimeout(() => {
            if (document.body.contains(successMessage)) {
                document.body.removeChild(successMessage);
            }
        }, 3000);
        
        // Reload the timesheet table
        setTimeout(() => {
            loadTimesheets();
        }, 1000);
    }
    
    // If error
    if (event.detail.xhr.status >= 400) {
        console.log('Error creating timesheet:', event.detail.xhr.responseText);
        
        // Parse error message from response
        let errorText = 'Error creating timesheet. Please try again.';
        try {
            const response = JSON.parse(event.detail.xhr.responseText);
            if (response.error) {
                errorText = response.error;
            }
        } catch (e) {
            // Use default error message if parsing fails
        }
        
        // Show error message
        const errorMessage = document.createElement('div');
        errorMessage.className = 'fixed top-4 right-4 bg-red-500 text-white px-6 py-3 rounded-md shadow-lg z-50';
        errorMessage.textContent = errorText;
        document.body.appendChild(errorMessage);
        
        // Remove message after 5 seconds
        setTimeout(() => {
            if (document.body.contains(errorMessage)) {
                document.body.removeChild(errorMessage);
            }
        }, 5000);
    }
});

// Restrict employee selector visibility for non-HR/Admin
(async function enforceEmployeeSelectorVisibility(){
    try {
        const resp = await fetch('/api/auth/profile', { credentials: 'same-origin' });
        if (!resp.ok) return;
        const data = await resp.json();
        const role = data && data.data && data.data.role;
        const wrapper = document.getElementById('employee-select-wrapper');
        const selectEl = document.getElementById('employee_id');
        if (!wrapper || !selectEl) return;
        if (role !== 'hr_manager' && role !== 'system_admin') {
            // If only one option (self), select it; otherwise, prepare hidden input
            const options = Array.from(selectEl.options).filter(o => o.value);
            if (options.length === 1) {
                selectEl.value = options[0].value;
            } else if (options.length > 1) {
                // For operational_manager (department scope), pick the option that matches current user if present (first as fallback)
                const currentFullName = (data.data && data.data.full_name) || '';
                const selfOption = options.find(o => o.textContent && o.textContent.trim() === currentFullName.trim());
                selectEl.value = (selfOption && selfOption.value) || options[0].value;
            }
            // Mirror value into hidden input and relax the select
            const hid = document.createElement('input');
            hid.type = 'hidden';
            hid.name = 'employee_id';
            hid.value = selectEl.value || '';
            selectEl.parentElement.appendChild(hid);
            selectEl.required = false;
            selectEl.disabled = true;
            wrapper.style.display = 'none';
        }
    } catch(e) { console.warn('employee selector visibility guard failed', e); }
})();
</script>
