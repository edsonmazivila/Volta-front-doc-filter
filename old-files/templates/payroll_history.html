{{if .PayrollHistory}}
<table class="min-w-full divide-y divide-gray-200">
    <thead class="bg-gray-50">
        <tr>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Pay Date</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Employees</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Gross Pay</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Net Pay</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
        </tr>
    </thead>
    <tbody class="bg-white divide-y divide-gray-200">
        {{range .PayrollHistory}}
        <tr>
            <td class="px-6 py-4 whitespace-nowrap">{{.Date}}</td>
            <td class="px-6 py-4 whitespace-nowrap">{{.Employees}}</td>
            <td class="px-6 py-4 whitespace-nowrap">${{printf "%.2f" .GrossPay}}</td>
            <td class="px-6 py-4 whitespace-nowrap">${{printf "%.2f" .NetPay}}</td>
            <td class="px-6 py-4 whitespace-nowrap">
                <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-green-100 text-green-800">
                    {{.Status}}
                </span>
            </td>
            <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                <button class="text-jech-accent hover:text-jech-dark mr-3" onclick="viewPayrollDetails('{{.ID}}', '{{.Date}}')">View</button>
                <div class="inline-flex gap-3">
                    <button class="text-jech-secondary hover:text-jech-dark" onclick="downloadPayrollReport('{{.ID}}', '{{.Date}}')">Export Summary</button>
                    <button class="text-jech-secondary hover:text-jech-dark" onclick="downloadBCI('{{.ID}}', '{{.Date}}')">Export BCI</button>
                    <button class="text-jech-secondary hover:text-jech-dark" onclick="downloadTabela('{{.ID}}', '{{.Date}}')">Export Tabela</button>
                </div>
            </td>
        </tr>
        {{end}}
    </tbody>
</table>
{{else}}
<div class="text-center py-6">
    <p class="text-gray-500">No payroll history found.</p>
</div>
{{end}}
