<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Attendance - NexuPayroll</title>
    <script src="https://cdn.tailwindcss.com"></script>
    {{template "partials/jech-colors.html" .}}
    <link rel="stylesheet" href="/static/css/custom.css">
</head>
<body class="h-full bg-gray-100">
    <div id="app" class="min-h-full">
        {{template "partials/nav.html" .}}
        <div class="md:pl-64 relative z-0">
            <main id="main-content" class="mt-5 container mx-auto px-4">
                <div class="mb-2 text-sm text-gray-500 flex items-center gap-2">
                    <a href="/dashboard" class="hover:text-jech-accent">Dashboard</a>
                    <svg class="h-4 w-4 text-gray-400" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M7.21 14.77a.75.75 0 01.02-1.06L10.94 10 7.23 6.29A.75.75 0 118.29 5.23l4.25 4.24a.75.75 0 010 1.06l-4.25 4.25a.75.75 0 01-1.08-.02z" clip-rule="evenodd"/></svg>
                    <span class="text-gray-700">My Attendance</span>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <section class="lg:col-span-2 elevated-card bg-white rounded-xl shadow-sm border border-gray-200">
                        <div class="px-6 py-4 border-b border-gray-200 flex items-center justify-between">
                            <h2 class="text-xl font-semibold text-gray-900">Monthly Calendar</h2>
                            <div class="flex items-center gap-3">
                            <input id="monthPicker" name="month" type="month" class="rounded-md border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-jech-accent"
                                   hx-on:htmx:load="try{if(!this.value){var d=new Date();var m=('0'+(d.getMonth()+1)).slice(-2);this.value=d.getFullYear()+'-'+m; if(window.htmx){htmx.trigger('#attendanceCalendar','refresh'); htmx.trigger('#attendanceSummary','refresh');}}}catch(e){}" />
                            <input id="monthShadow" name="month" type="hidden" value="">
                                <button id="checkInNow" data-user-id="{{.User.ID}}" class="btn btn-primary px-3 py-2 rounded-md text-sm">Check-in now</button>
                                <button id="checkOutNow" data-user-id="{{.User.ID}}" class="btn btn-secondary px-3 py-2 rounded-md text-sm">Check-out now</button>
                            </div>
                        </div>
                        <div id="attendanceCalendar"
                             class="p-4"
                             hx-get="/attendance/user/{{.User.ID}}"
                             hx-trigger="load, change from:#monthPicker"
                             hx-include="#monthPicker, #monthShadow"
                             hx-vals="js:{month: (document.getElementById('monthPicker')?.value || (new Date().toISOString().slice(0,7)))}"
                             hx-target="#attendanceCalendar"
                             hx-swap="innerHTML">
                            <div class="p-8 text-center text-gray-500 text-sm">Loading calendar…</div>
                        </div>
                        <div class="px-6 pb-4 text-xs text-gray-500">
                            <div class="flex items-center gap-4">
                                <span class="inline-flex items-center gap-2"><span class="inline-block w-3 h-3 rounded bg-green-500"></span> Present</span>
                                <span class="inline-flex items-center gap-2"><span class="inline-block w-3 h-3 rounded bg-red-500"></span> Absent</span>
                                <span class="inline-flex items-center gap-2"><span class="inline-block w-3 h-3 rounded bg-yellow-500"></span> Justified</span>
                            </div>
                        </div>
                    </section>

                    <section class="elevated-card bg-white rounded-xl shadow-sm border border-gray-200">
                        <div class="px-6 py-4 border-b border-gray-200 flex items-center justify-between">
                            <h2 class="text-xl font-semibold text-gray-900">Summary</h2>
                        </div>
                        <div id="attendanceSummary"
                             class="p-4"
                             hx-get="/attendance/user/{{.User.ID}}/summary"
                             hx-trigger="load, change from:#monthPicker"
                             hx-include="#monthPicker, #monthShadow"
                             hx-vals="js:{month: (document.getElementById('monthPicker')?.value || (new Date().toISOString().slice(0,7)))}"
                             hx-target="#attendanceSummary"
                             hx-swap="innerHTML">
                            <div class="space-y-2 text-sm text-gray-600">
                                <div class="flex items-center justify-between">
                                    <span>Total Present</span>
                                    <span class="font-semibold">—</span>
                                </div>
                                <div class="flex items-center justify-between">
                                    <span>Justified Absences</span>
                                    <span class="font-semibold">—</span>
                                </div>
                                <div class="flex items-center justify-between">
                                    <span>Unjustified Absences</span>
                                    <span class="font-semibold">—</span>
                                </div>
                            </div>
                        </div>
                    </section>
                </div>

                <section class="mt-8 elevated-card bg-white rounded-xl shadow-sm border border-gray-200">
                    <div class="px-6 py-4 border-b border-gray-200 flex items-center justify-between">
                        <h2 class="text-xl font-semibold text-gray-900">Absence Justifications</h2>
                        <button class="btn btn-primary px-3 py-2 rounded-md text-sm"
                                hx-get="/attendance/justifications/new"
                                hx-target="#justificationForm"
                                hx-swap="innerHTML"
                                aria-controls="justificationForm"
                                aria-expanded="true">
                            New Justification
                        </button>
                    </div>
                    <div id="justificationForm" class="px-6 py-4"></div>
                    <div class="px-6 py-4 overflow-x-auto">
                        <table class="min-w-full text-left">
                            <thead>
                                <tr class="text-xs uppercase text-gray-500">
                                    <th class="px-4 py-2">Date</th>
                                    <th class="px-4 py-2">Status</th>
                                    <th class="px-4 py-2">Reason</th>
                                    <th class="px-4 py-2">Submitted</th>
                                    <th class="px-4 py-2"></th>
                                </tr>
                            </thead>
                            <tbody id="justificationTable"
                                   hx-get="/attendance/justifications/my"
                                   hx-trigger="load, htmx:afterOnLoad from:#justificationForm, refresh"
                                   hx-target="#justificationTable"
                                   hx-swap="innerHTML">
                                <tr><td class="px-4 py-6 text-center text-sm text-gray-500" colspan="5">Loading…</td></tr>
                            </tbody>
                        </table>
                    </div>
                </section>
            </main>
        </div>
    </div>
    <script src="/static/js/htmx.min.js"></script>
    <script>
    (function(){
        // Initialize month picker with current month
        const mp = document.getElementById('monthPicker');
        const ms = document.getElementById('monthShadow');
        if (mp && !mp.value) {
            const d = new Date();
            const m = String(d.getMonth()+1).padStart(2,'0');
            mp.value = `${d.getFullYear()}-${m}`;
        }
        if (ms) { ms.value = mp?.value || ms.value || new Date().toISOString().slice(0,7); }
        if (mp && ms) { mp.addEventListener('change', function(){ ms.value = mp.value || new Date().toISOString().slice(0,7); }); }
        // Check-in now handler
        const btn = document.getElementById('checkInNow');
        if (btn) {
            btn.addEventListener('click', async function(){
                const userId = btn.getAttribute('data-user-id');
                const now = new Date();
                const hh = String(now.getHours()).padStart(2,'0');
                const mm = String(now.getMinutes()).padStart(2,'0');
                const yyyy = now.getFullYear();
                const mm2 = String(now.getMonth()+1).padStart(2,'0');
                const dd = String(now.getDate()).padStart(2,'0');
                const payload = { userId: userId, clockIn: `${hh}:${mm}`, date: `${yyyy}-${mm2}-${dd}`, timezone: Intl.DateTimeFormat().resolvedOptions().timeZone };
                try {
                    const res = await fetch('/api/attendance/check-in', {
                        method: 'POST',
                        credentials: 'include',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    if (!res.ok) {
                        const t = await res.text();
                        alert('Check-in failed: ' + t);
                        return;
                    }
                    // Refresh calendar and summary via HTMX triggers
                    if (window.htmx) {
                        window.htmx.trigger('#attendanceCalendar', 'refresh');
                        window.htmx.trigger('#attendanceSummary', 'refresh');
                    } else {
                        window.location.reload();
                    }
                } catch (e) {
                    alert('Check-in error');
                }
            });
        }
        // Check-out now handler
        const btnOut = document.getElementById('checkOutNow');
        if (btnOut) {
            btnOut.addEventListener('click', async function(){
                const userId = btnOut.getAttribute('data-user-id');
                const now = new Date();
                const hh = String(now.getHours()).padStart(2,'0');
                const mm = String(now.getMinutes()).padStart(2,'0');
                const yyyy = now.getFullYear();
                const mm2 = String(now.getMonth()+1).padStart(2,'0');
                const dd = String(now.getDate()).padStart(2,'0');
                const payload = { userId: userId, date: `${yyyy}-${mm2}-${dd}`, clockOut: `${hh}:${mm}`, timezone: Intl.DateTimeFormat().resolvedOptions().timeZone };
                try {
                    const res = await fetch('/api/attendance/check-out', {
                        method: 'POST',
                        credentials: 'include',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    if (!res.ok) {
                        const t = await res.text();
                        alert('Check-out failed: ' + t);
                        return;
                    }
                    if (window.htmx) {
                        window.htmx.trigger('#attendanceCalendar', 'refresh');
                        window.htmx.trigger('#attendanceSummary', 'refresh');
                        window.htmx.trigger('#justificationTable', 'refresh');
                    } else {
                        window.location.reload();
                    }
                } catch (e) {
                    alert('Check-out error');
                }
            });
        }
        // Wire custom refresh triggers to re-fetch
        if (window.htmx) {
            document.getElementById('attendanceCalendar')?.setAttribute('hx-trigger', 'load, change from:#monthPicker, refresh');
            document.getElementById('attendanceSummary')?.setAttribute('hx-trigger', 'load, change from:#monthPicker, refresh');
            document.getElementById('justificationTable')?.setAttribute('hx-trigger', 'load, htmx:afterOnLoad from:#justificationForm, refresh');
        }
    })();
    </script>
</body>
</html>
