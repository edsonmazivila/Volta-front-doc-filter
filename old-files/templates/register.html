<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - NexuPayroll</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/static/js/htmx.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'jech-blue': '#1e40af',
                        'jech-dark': '#0f172a',
                        'jech-light': '#f8fafc',
                        'jech-accent': '#3b82f6',
                        'jech-secondary': '#64748b'
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-in-out',
                        'slide-up': 'slideUp 0.6s ease-out',
                        'pulse-glow': 'pulseGlow 2s infinite'
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' }
                        },
                        slideUp: {
                            '0%': { transform: 'translateY(20px)', opacity: '0' },
                            '100%': { transform: 'translateY(0)', opacity: '1' }
                        },
                        pulseGlow: {
                            '0%, 100%': { boxShadow: '0 0 20px rgba(59, 130, 246, 0.3)' },
                            '50%': { boxShadow: '0 0 30px rgba(59, 130, 246, 0.6)' }
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="/static/css/custom.css">
    <link rel="icon" type="image/svg+xml" href="/static/image/symbol-purple-1000x1198.svg">
    <link rel="apple-touch-icon" href="/static/image/symbol-purple-1000x1198.svg">
</head>
<body class="h-full bg-gradient-to-br from-slate-900 via-blue-900 to-slate-900">
    <!-- Background Animation -->
    <div class="absolute inset-0 overflow-hidden">
        <div class="absolute -top-1/2 -left-1/2 w-full h-full bg-gradient-to-r from-blue-600/10 to-purple-600/10 rounded-full animate-spin" style="animation-duration: 20s;"></div>
        <div class="absolute -bottom-1/2 -right-1/2 w-full h-full bg-gradient-to-l from-indigo-600/10 to-blue-600/10 rounded-full animate-spin" style="animation-duration: 25s; animation-direction: reverse;"></div>
    </div>
    
    <main id="main-content">
    <div class="relative min-h-full flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
        <div class="max-w-2xl w-full space-y-8">
            <!-- Logo and Header -->
            <div class="text-center animate-fade-in">
                <div class="mx-auto h-20 w-20 rounded-2xl flex items-center justify-center mb-6 shadow-2xl animate-pulse-glow bg-white/10">
                    <img src="/static/image/symbol-purple-1000x1198.svg" alt="NexuPayroll" class="h-12 w-12"/>
                </div>
                <h2 class="text-4xl font-extrabold text-white mb-2">
                    Create Your Account
                </h2>
                <p class="text-lg text-blue-200">
                    Get started with NexuPayroll and streamline your payroll operations
                </p>
            </div>

            <!-- Register Form -->
            <div id="register-container" class="animate-slide-up">
                <div class="bg-white/10 backdrop-blur-lg rounded-2xl shadow-2xl p-8 border border-white/20">
                    <form action="/register" method="POST" class="space-y-6">
                        <!-- Company Name -->
                        <div>
                            <label for="company_name" class="block text-sm font-medium text-blue-100 mb-2">
                                Company Name
                            </label>
                            <div class="relative">
                                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                    <svg class="h-5 w-5 text-blue-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path>
                                    </svg>
                                </div>
                                <input id="company_name" name="company_name" type="text" required 
                                       class="block w-full pl-10 pr-3 py-3 border-0 rounded-xl bg-white/20 text-white placeholder-blue-200 focus:ring-2 focus:ring-blue-400 focus:bg-white/30 transition-all duration-200 backdrop-blur-sm"
                                       placeholder="Enter your company name">
                            </div>
                        </div>

                        <!-- Admin Full Name -->
                        <div>
                            <label for="admin_name" class="block text-sm font-medium text-blue-100 mb-2">
                                Admin Full Name
                            </label>
                            <div class="relative">
                                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                    <svg class="h-5 w-5 text-blue-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                                    </svg>
                                </div>
                                <input id="admin_name" name="admin_name" type="text" required 
                                       class="block w-full pl-10 pr-3 py-3 border-0 rounded-xl bg-white/20 text-white placeholder-blue-200 focus:ring-2 focus:ring-blue-400 focus:bg-white/30 transition-all duration-200 backdrop-blur-sm"
                                       placeholder="Enter admin full name">
                            </div>
                        </div>

                        <!-- Email -->
                        <div>
                            <label for="email" class="block text-sm font-medium text-blue-100 mb-2">
                                Email Address
                            </label>
                            <div class="relative">
                                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                    <svg class="h-5 w-5 text-blue-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"></path>
                                    </svg>
                                </div>
                                <input id="email" name="email" type="email" required 
                                       class="block w-full pl-10 pr-3 py-3 border-0 rounded-xl bg-white/20 text-white placeholder-blue-200 focus:ring-2 focus:ring-blue-400 focus:bg-white/30 transition-all duration-200 backdrop-blur-sm"
                                       placeholder="Enter your email">
                            </div>
                        </div>

                        <!-- Password -->
                        <div>
                            <label for="password" class="block text-sm font-medium text-blue-100 mb-2">
                                Password
                            </label>
                            <div class="relative">
                                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                    <svg class="h-5 w-5 text-blue-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                                    </svg>
                                </div>
                                <input id="password" name="password" type="password" required 
                                       class="block w-full pl-10 pr-3 py-3 border-0 rounded-xl bg-white/20 text-white placeholder-blue-200 focus:ring-2 focus:ring-blue-400 focus:bg-white/30 transition-all duration-200 backdrop-blur-sm"
                                       placeholder="Create a strong password">
                            </div>
                        </div>

                        <!-- Terms and Conditions -->
                        <div class="flex items-center">
                            <input id="terms" name="terms" type="checkbox" required
                                   class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded bg-white/20">
                            <label for="terms" class="ml-2 block text-sm text-blue-200">
                                I agree to the 
                                <a href="#" class="font-medium text-blue-300 hover:text-blue-200 transition-colors">
                                    Terms of Service
                                </a> 
                                and 
                                <a href="#" class="font-medium text-blue-300 hover:text-blue-200 transition-colors">
                                    Privacy Policy
                                </a>
                            </label>
                        </div>

                        <!-- Submit Button -->
                        <div>
                            <button type="submit" 
                                    class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-medium rounded-xl text-white bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transform hover:scale-105 transition-all duration-200 shadow-lg hover:shadow-xl">
                                <span class="absolute left-0 inset-y-0 flex items-center pl-3">
                                    <svg class="h-5 w-5 text-blue-300 group-hover:text-blue-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path>
                                    </svg>
                                </span>
                                Create Account
                            </button>
                        </div>

                        <!-- Back to Landing -->
                        <div class="text-center">
                            <a href="/landing" 
                               class="text-blue-300 hover:text-blue-200 transition-colors font-medium">
                                ← Back to landing page
                            </a>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Features -->
            <div class="text-center text-blue-200 text-sm animate-fade-in" style="animation-delay: 0.3s;">
                <div class="flex justify-center space-x-6 text-xs">
                    <div class="flex items-center">
                        <svg class="h-4 w-4 mr-1" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd"></path>
                        </svg>
                        Secure
                    </div>
                    <div class="flex items-center">
                        <svg class="h-4 w-4 mr-1" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M3 4a1 1 0 011-1h12a1 1 0 011 1v2a1 1 0 01-1 1H4a1 1 0 01-1-1V4zM3 10a1 1 0 011-1h6a1 1 0 011 1v6a1 1 0 01-1 1H4a1 1 0 01-1-1v-6zM14 9a1 1 0 00-1 1v6a1 1 0 001 1h2a1 1 0 001-1v-6a1 1 0 00-1-1h-2z" clip-rule="evenodd"></path>
                        </svg>
                        Responsive
                    </div>
                    <div class="flex items-center">
                        <svg class="h-4 w-4 mr-1" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M11.3 1.046A1 1 0 0112 2v5h4a1 1 0 01.82 1.573l-7 10A1 1 0 018 18v-5H4a1 1 0 01-.82-1.573l7-10a1 1 0 011.12-.38z" clip-rule="evenodd"></path>
                        </svg>
                        Fast
                    </div>
                </div>
            </div>
        </div>
    </div>
    </main>

    <script>
        // Form submission handler
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.querySelector('form[action="/register"]');
            
            form.addEventListener('submit', function(e) {
                e.preventDefault();
                
                const formData = new FormData(form);
                
                fetch('/register', {
                    method: 'POST',
                    body: formData
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        // Show success message
                        showMessage('success', data.message);
                        
                        // Redirect after 2 seconds
                        setTimeout(() => {
                            window.location.href = data.redirect || '/login';
                        }, 2000);
                    } else {
                        // Show error message
                        showMessage('error', data.message || 'Error creating account');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    showMessage('error', 'Connection error. Please try again.');
                });
            });
        });
        
        function showMessage(type, message) {
            // Remove existing messages
            const existingMessages = document.querySelectorAll('.message-container');
            existingMessages.forEach(msg => msg.remove());
            
            // Create message element
            const messageDiv = document.createElement('div');
            messageDiv.className = `message-container fixed top-4 right-4 z-50 p-4 rounded-lg shadow-lg max-w-md animate-slide-up`;
            
            if (type === 'success') {
                messageDiv.className += ' bg-green-500/20 border border-green-500/30 text-green-300';
            } else {
                messageDiv.className += ' bg-red-500/20 border border-red-500/30 text-red-300';
            }
            
            messageDiv.innerHTML = `
                <div class="flex items-center">
                    <svg class="h-5 w-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${type === 'success' ? 'M5 13l4 4L19 7' : 'M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z'}"></path>
                    </svg>
                    <span>${message}</span>
                </div>
            `;
            
            document.body.appendChild(messageDiv);
            
            // Remove message after 5 seconds
            setTimeout(() => {
                messageDiv.remove();
            }, 5000);
        }
    </script>
</body>
</html>
