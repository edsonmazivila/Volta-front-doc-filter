<div class="max-w-2xl mx-auto">
    <div class="text-center mb-8 animate-fade-in">
        <h2 class="text-3xl font-bold text-white mb-4">Create Your Account</h2>
        <p class="text-blue-200">Get started with NexuPayroll and streamline your payroll operations</p>
    </div>

    <div class="bg-white/10 backdrop-blur-lg rounded-2xl shadow-2xl p-8 border border-white/20 animate-slide-up">
        <form hx-post="/register" hx-target="#register-container, #main-content, body" hx-swap="innerHTML" hx-on="htmx:afterRequest: try { const res = JSON.parse(event.detail.xhr.responseText); if (res && res.success && res.redirect) { window.location.href = res.redirect; } } catch(e){}" class="space-y-6">
            <!-- Company Name -->
            <div>
                <label for="company_name" class="block text-sm font-medium text-blue-100 mb-2">
                    Company Name
                </label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <svg class="h-5 w-5 text-blue-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path>
                        </svg>
                    </div>
                    <input id="company_name" name="company_name" type="text" required 
                           class="block w-full pl-10 pr-3 py-3 border-0 rounded-xl bg-white/20 text-white placeholder-blue-200 focus:ring-2 focus:ring-blue-400 focus:bg-white/30 transition-all duration-200 backdrop-blur-sm"
                           placeholder="Enter your company name">
                </div>
            </div>

            <!-- Admin Full Name -->
            <div>
                <label for="admin_name" class="block text-sm font-medium text-blue-100 mb-2">
                    Administrator Full Name
                </label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <svg class="h-5 w-5 text-blue-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                        </svg>
                    </div>
                    <input id="admin_name" name="admin_name" type="text" required 
                           class="block w-full pl-10 pr-3 py-3 border-0 rounded-xl bg-white/20 text-white placeholder-blue-200 focus:ring-2 focus:ring-blue-400 focus:bg-white/30 transition-all duration-200 backdrop-blur-sm"
                           placeholder="Enter administrator full name">
                </div>
            </div>

            <!-- Email -->
            <div>
                <label for="email" class="block text-sm font-medium text-blue-100 mb-2">
                    Email Address
                </label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <svg class="h-5 w-5 text-blue-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"></path>
                        </svg>
                    </div>
                    <input id="email" name="email" type="email" required 
                           class="block w-full pl-10 pr-3 py-3 border-0 rounded-xl bg-white/20 text-white placeholder-blue-200 focus:ring-2 focus:ring-blue-400 focus:bg-white/30 transition-all duration-200 backdrop-blur-sm"
                           placeholder="Enter your email address">
                </div>
            </div>

            <!-- Password -->
            <div>
                <label for="password" class="block text-sm font-medium text-blue-100 mb-2">
                    Password
                </label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <svg class="h-5 w-5 text-blue-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                        </svg>
                    </div>
                    <input id="password" name="password" type="password" required 
                           class="block w-full pl-10 pr-3 py-3 border-0 rounded-xl bg-white/20 text-white placeholder-blue-200 focus:ring-2 focus:ring-blue-400 focus:bg-white/30 transition-all duration-200 backdrop-blur-sm"
                           placeholder="Create a strong password">
                </div>
            </div>

            <!-- Terms and Conditions -->
            <div class="flex items-start">
                <div class="flex items-center h-5">
                    <input id="terms" name="terms" type="checkbox" required
                           class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded bg-white/20">
                </div>
                <div class="ml-3 text-sm">
                    <label for="terms" class="text-blue-200">
                        I agree to the 
                        <a href="#" class="text-blue-300 hover:text-blue-200 underline">Terms of Service</a> 
                        and 
                        <a href="#" class="text-blue-300 hover:text-blue-200 underline">Privacy Policy</a>
                    </label>
                </div>
            </div>

            <!-- Submit Button -->
            <div>
                <button type="submit" 
                        class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-medium rounded-xl text-white bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transform hover:scale-105 transition-all duration-200 shadow-lg hover:shadow-xl">
                    <span class="absolute left-0 inset-y-0 flex items-center pl-3">
                        <svg class="h-5 w-5 text-blue-300 group-hover:text-blue-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path>
                        </svg>
                    </span>
                    Create Account
                </button>
            </div>

            <!-- Back to Landing -->
            <div class="text-center">
                <button type="button" 
                        hx-get="/landing" 
                        hx-target="body" 
                        hx-swap="innerHTML"
                        class="text-blue-300 hover:text-blue-200 transition-colors font-medium">
                    ← Back to landing page
                </button>
            </div>
        </form>
    </div>

    <!-- Success/Error Messages -->
    <div id="register-messages" class="mt-6"></div>
</div>
