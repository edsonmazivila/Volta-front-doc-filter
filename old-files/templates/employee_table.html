{{if .Employees}}
<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
    {{range .Employees}}
    <div role="button" tabindex="0"
         hx-get="/employees/{{.ID}}/view" hx-target="#main-content" hx-swap="innerHTML"
         class="group cursor-pointer rounded-2xl border border-white/20 bg-white/10 backdrop-blur-md shadow-sm hover:shadow-md transition-all duration-200 focus:outline-none focus-visible:ring-2 focus-visible:ring-jech-accent focus-visible:ring-offset-2 focus-visible:ring-offset-white dark:focus-visible:ring-offset-slate-900">
        <div class="p-4">
            <div class="flex items-center gap-3 mb-3">
                <span class="h-2.5 w-2.5 rounded-full bg-jech-accent shadow-sm"></span>
                <div class="min-w-0">
                    <p class="text-sm font-semibold text-gray-900 truncate">{{.FullName}}</p>
                    <p class="text-xs text-gray-500 truncate">{{if .Email}}{{.Email}}{{end}}</p>
                </div>
            </div>
            <div class="flex items-center justify-between text-sm">
                <span class="text-gray-600">{{if .Department}}{{.Department}}{{else}}N/A{{end}}</span>
                <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full {{if eq .EmploymentStatus "active"}}bg-green-100 text-green-800{{else}}bg-red-100 text-red-800{{end}}">
                    {{if eq .EmploymentStatus "active"}}Active{{else}}Inactive{{end}}
                </span>
            </div>
        </div>
        <div class="flex items-center justify-end gap-2 px-4 pb-4 opacity-0 group-hover:opacity-100 transition-opacity">
            <button hx-get="/employees/{{.ID}}/view" hx-target="#main-content" class="text-blue-600 hover:text-blue-800 text-sm inline-flex items-center gap-1">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.477 0 8.268 2.943 9.542 7-1.274 4.057-5.065 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                </svg>
                View
            </button>
            <button hx-get="/employees/{{.ID}}/edit" hx-target="#main-content" class="text-gray-600 hover:text-gray-800 text-sm inline-flex items-center gap-1">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
                </svg>
                Edit
            </button>
        </div>
    </div>
    {{end}}
</div>
{{else}}
<div class="text-center py-6">
    <p class="text-gray-500">No employees found.</p>
</div>
{{end}}
