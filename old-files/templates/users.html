<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management - NexuPayroll</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'jech-blue': '#1e40af',
                        'jech-dark': '#0f172a',
                        'jech-light': '#f8fafc',
                        'jech-accent': '#3b82f6',
                        'jech-secondary': '#64748b'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="/static/css/custom.css">
</head>
<body class="h-full bg-gray-100">
    <div id="app" class="min-h-full">
        {{template "partials/nav.html" .}}
        <div class="md:pl-64 relative z-0">
            <main id="main-content" class="mt-5 container mx-auto px-4">
                <div class="mb-2 text-sm text-gray-500 flex items-center gap-2">
                    <a href="/dashboard" class="hover:text-jech-accent">Dashboard</a>
                    <svg class="h-4 w-4 text-gray-400" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M7.21 14.77a.75.75 0 01.02-1.06L10.94 10 7.23 6.29A.75.75 0 118.29 5.23l4.25 4.24a.75.75 0 010 1.06l-4.25 4.25a.75.75 0 01-1.08-.02z" clip-rule="evenodd"/></svg>
                    <span class="text-gray-700">Users</span>
                </div>
                <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-3 mb-6">
                    <div>
                        <h1 class="text-2xl font-semibold text-gray-900">User Management</h1>
                        <p class="text-sm text-gray-500">Administer roles, status and access.</p>
                    </div>
                    <div>
                        <button onclick="showCreateUserModal()" class="btn btn-primary">
                            <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path d="M10 5a1 1 0 011 1v3h3a1 1 0 110 2h-3v3a1 1 0 11-2 0v-3H6a1 1 0 110-2h3V6a1 1 0 011-1z"/></svg>
                            Add New User
                        </button>
                    </div>
                </div>

                <section class="mb-8">
                    <div class="grid grid-cols-1 md:grid-cols-5 gap-6">
                        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                            <h3 class="text-sm font-medium text-gray-700 mb-1">Total Users</h3>
                            <div id="totalUsers" class="text-2xl font-semibold text-jech-accent">-</div>
                        </div>
                        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                            <h3 class="text-sm font-medium text-gray-700 mb-1">Active Users</h3>
                            <div id="activeUsers" class="text-2xl font-semibold text-green-600">-</div>
                        </div>
                        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                            <h3 class="text-sm font-medium text-gray-700 mb-1">Admins</h3>
                            <div id="adminUsers" class="text-2xl font-semibold text-red-600">-</div>
                        </div>
                        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                            <h3 class="text-sm font-medium text-gray-700 mb-1">Managers</h3>
                            <div id="managerUsers" class="text-2xl font-semibold text-purple-600">-</div>
                        </div>
                        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                            <h3 class="text-sm font-medium text-gray-700 mb-1">Collaborators</h3>
                            <div id="employeeUsers" class="text-2xl font-semibold text-blue-600">-</div>
                        </div>
                    </div>
                </section>

                <section class="mb-8">
                    <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                        <div class="px-6 py-4 border-b border-gray-200">
                            <h2 class="text-xl font-semibold text-gray-900">Users</h2>
                        </div>
                        <div id="users-table" class="overflow-x-auto">
                            <div class="p-6">
                                <div class="animate-pulse space-y-3">
                                    <div class="h-4 bg-gray-200 rounded"></div>
                                    <div class="h-4 bg-gray-200 rounded"></div>
                                    <div class="h-4 bg-gray-200 rounded"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <!-- Create/Edit User Modal -->
    <div id="userModal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50">
        <div class="flex items-center justify-center min-h-screen p-4">
            <div class="bg-white rounded-lg shadow-xl max-w-md w-full">
                <div class="flex justify-between items-center p-6 border-b">
                    <h3 id="modalTitle" class="text-xl font-semibold text-jech-dark">Add New User</h3>
                    <button onclick="hideUserModal()" class="text-gray-400 hover:text-gray-600">
                        <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                        </svg>
                    </button>
                </div>
                <div class="p-6">
                    <form id="userForm">
                        <div class="space-y-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">First Name</label>
                                <input type="text" name="first_name" id="firstName" required class="input-modern">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Last Name</label>
                                <input type="text" name="last_name" id="lastName" required class="input-modern">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Email</label>
                                <input type="email" name="email" id="email" required class="input-modern">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Role</label>
                                <select name="role" id="role" required class="select-modern">
                                    <option value="">Select Role</option>
                                    <option value="employee">Employee</option>
                                    <option value="operational_manager">Operational Manager</option>
                                    <option value="hr_manager">HR Manager</option>
                                    <option value="payroll_manager">Payroll Manager</option>
                                    <option value="system_admin">System Administrator</option>
                                </select>
                            </div>
                            <div id="passwordField">
                                <label class="block text-sm font-medium text-gray-700 mb-2">Password</label>
                                <input type="password" name="password" id="password" required minlength="8" class="input-modern">
                            </div>
                            <div class="flex items-center">
                                <input type="checkbox" name="is_active" id="isActive" checked
                                    class="h-4 w-4 text-jech-accent focus:ring-jech-accent border-gray-300 rounded">
                                <label for="isActive" class="ml-2 block text-sm text-gray-900">Active</label>
                            </div>
                        </div>
                        <div class="flex justify-end space-x-3 mt-6">
                            <button type="button" onclick="hideUserModal()" class="btn btn-secondary">Cancel</button>
                            <button type="submit" class="btn btn-primary">Save User</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="deleteModal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50">
        <div class="flex items-center justify-center min-h-screen p-4">
            <div class="bg-white rounded-lg shadow-xl max-w-md w-full">
                <div class="p-6">
                    <h3 class="text-lg font-semibold text-jech-dark">Confirm Delete</h3>
                    <p class="text-gray-600 my-4">Are you sure you want to delete this user? This action cannot be undone.</p>
                    <div class="flex justify-end space-x-3">
                        <button onclick="hideDeleteModal()"
                            class="px-4 py-2 text-gray-600 border border-gray-300 rounded-md hover:bg-gray-50">
                            Cancel
                        </button>
                        <button onclick="confirmDeleteUser()"
                            class="px-4 py-2 bg-red-600 text-white rounded-md hover:bg-red-700">
                            Delete
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/htmx.min.js"></script>
    <script>
    // Fallback: if local HTMX fails to load (e.g., wrong MIME in prod), load from CDN
    (function(){
        function ensureHTMX(){
            if (!window.htmx) {
                var s=document.createElement('script');
                s.src='https://unpkg.com/htmx.org@1.9.10';
                s.defer=true;
                document.head.appendChild(s);
            }
        }
        if (!window.htmx) ensureHTMX();
        window.addEventListener('error', function(e){
            var t=e.target||{}; if (t.tagName==='SCRIPT' && (t.src||'').indexOf('/static/js/htmx.min.js')!==-1) ensureHTMX();
        }, true);
    })();
    </script>
    <script src="/static/js/nav-dropdown.js"></script>
    <script src="/static/js/users.js"></script>
    <script>
    // Re-init after HTMX swaps (when navigating without full reload)
    document.addEventListener('htmx:afterSwap', function(evt){
        var target = evt.target || (evt.detail && evt.detail.target);
        if (target && (target.id === 'main-content' || (target.closest && target.closest('#main-content')))) {
            if (window.NexuPayrollUsersInit) {
                try { window.NexuPayrollUsersInit(); } catch (_) {}
            }
        }
    });
    </script>
</body>
</html>
