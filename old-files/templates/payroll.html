<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payroll - NexuPayroll</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'jech-blue': '#1e40af',
                        'jech-dark': '#0f172a',
                        'jech-light': '#f8fafc',
                        'jech-accent': '#3b82f6',
                        'jech-secondary': '#64748b'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="/static/css/custom.css">
</head>
<body class="h-full bg-gray-100">
    <div id="app" class="min-h-full">
        {{template "partials/nav.html" .}}
        <div class="md:pl-64 relative z-0">
            <main id="main-content" class="mt-5 container mx-auto px-4">
                <div class="mb-2 text-sm text-gray-500 flex items-center gap-2">
                    <a href="/dashboard" class="hover:text-jech-accent">Dashboard</a>
                    <svg class="h-4 w-4 text-gray-400" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M7.21 14.77a.75.75 0 01.02-1.06L10.94 10 7.23 6.29A.75.75 0 118.29 5.23l4.25 4.24a.75.75 0 010 1.06l-4.25 4.25a.75.75 0 01-1.08-.02z" clip-rule="evenodd"/></svg>
                    <span class="text-gray-700">Payroll</span>
                </div>

                <div class="flex justify-between items-center mb-6">
                    <h1 class="text-2xl font-semibold text-jech-dark">Payroll Management</h1>
                    <div class="flex space-x-3">
                        <button onclick="runPayroll()" class="px-4 py-2 bg-green-600 text-white rounded-full shadow-sm hover:bg-green-700">Run Payroll</button>
                        <button onclick="calculatePayroll()" class="px-4 py-2 bg-jech-accent text-white rounded-full shadow-sm hover:bg-jech-blue">Calculate</button>
                    </div>
                </div>

                <section class="mb-8">
                    <div id="payroll-stats">
                        <div class="p-6 text-center">
                            <div class="spinner mx-auto mb-4"></div>
                            <p class="text-gray-500">Loading payroll statistics...</p>
                        </div>
                    </div>
                </section>

                <section class="mb-8">
                    <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                        <div class="px-6 py-4 border-b border-gray-200">
                            <h2 class="text-xl font-semibold text-jech-dark">Recent Payroll Runs</h2>
                        </div>
                        <div id="payroll-history" class="overflow-x-auto">
                            <div class="p-6 text-center">
                                <div class="spinner mx-auto mb-4"></div>
                                <p class="text-gray-500">Loading payroll history...</p>
                            </div>
                        </div>
                    </div>
                </section>

                <section>
                    <div class="bg-white rounded-xl shadow-sm border border-gray-200">
                        <div class="px-6 py-4 border-b border-gray-200">
                            <h2 class="text-xl font-semibold text-jech-dark">Current Pay Period</h2>
                        </div>
                        <div class="p-6">
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-2">Pay Period Start</label>
                                    <input type="date" id="period-start" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-jech-accent">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-2">Pay Period End</label>
                                    <input type="date" id="period-end" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-jech-accent">
                                </div>
                            </div>
                            <div class="mt-6">
                                <button onclick="previewPayroll()" class="px-4 py-2 bg-jech-secondary text-white rounded-full shadow-sm hover:bg-jech-dark">Preview Payroll</button>
                            </div>
                        </div>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <div id="modal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50">
        <div class="flex items-center justify-center min-h-screen p-4">
            <div class="bg-white rounded-lg shadow-xl max-w-4xl w-full max-h-screen overflow-y-auto">
                <div class="flex justify-between items-center p-6 border-b">
                    <h3 class="text-xl font-semibold text-jech-dark">Payroll Details</h3>
                    <button onclick="hideModal()" class="text-gray-400 hover:text-gray-600">
                        <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                </div>
                <div id="modal-content" class="p-6"></div>
            </div>
        </div>
    </div>

    <script src="/static/js/htmx.min.js"></script>
    <script src="/static/js/nav-dropdown.js"></script>
    <script src="/static/js/payroll.js?v=2025010801"></script>
</body>
</html>
