version: "3.9"

# =============================================================================
# Volta HR Docker Compose Configuration
# Includes application and Datadog Agent for APM
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Next.js Application
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: volta-hr-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Application configuration
      - NODE_ENV=production

      # Datadog APM configuration
      - DD_ENV=${DD_ENV:-development}
      - DD_SERVICE=volta-hr
      - DD_VERSION=${DD_VERSION:-0.1.0}
      - DD_AGENT_HOST=datadog-agent
      - DD_TRACE_AGENT_PORT=8126
      - DD_TRACE_SAMPLE_RATE=1.0
      - DD_PROFILING_ENABLED=false
      - DD_LOGS_INJECTION=true
    depends_on:
      datadog-agent:
        condition: service_healthy
    networks:
      - volta-hr-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Datadog Agent
  # Collects traces, metrics, and logs from the application
  # ---------------------------------------------------------------------------
  datadog-agent:
    image: gcr.io/datadoghq/agent:7
    container_name: volta-hr-datadog-agent
    restart: unless-stopped
    environment:
      # Datadog API key (required)
      - DD_API_KEY=${DD_API_KEY:?DD_API_KEY is required}

      # Site configuration (defaults to US)
      - DD_SITE=${DD_SITE:-datadoghq.com}

      # APM configuration
      - DD_APM_ENABLED=true
      - DD_APM_NON_LOCAL_TRAFFIC=true

      # Log collection
      - DD_LOGS_ENABLED=true
      - DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL=true

      # Process monitoring
      - DD_PROCESS_AGENT_ENABLED=true

      # Container monitoring
      - DD_CONTAINER_EXCLUDE="name:datadog-agent"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc/:/host/proc/:ro
      - /sys/fs/cgroup/:/host/sys/fs/cgroup:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    ports:
      - "8126:8126" # APM traces
      - "8125:8125/udp" # DogStatsD metrics
    networks:
      - volta-hr-network
    healthcheck:
      test: ["CMD-SHELL", "agent health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  volta-hr-network:
    driver: bridge
    name: volta-hr-network

