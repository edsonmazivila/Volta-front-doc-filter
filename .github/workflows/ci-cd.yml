name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Use concurrency to cancel in-progress runs when a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  REGISTRY: docker.io
  IMAGE_NAME: doricodynamics/volta-front

jobs:
  version:
    name: Determine Version
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.semver.outputs.new_version }}
      version_changed: ${{ steps.semver.outputs.version_changed }}
      changelog: ${{ steps.changelog.outputs.changelog }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest tag
        id: latest_tag
        shell: bash
        run: |
          latest_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.1.0")
          if [ "$latest_tag" = "v0.1.0" ] && ! git rev-parse "v0.1.0" >/dev/null 2>&1; then
            echo "latest_tag=HEAD" >> $GITHUB_OUTPUT
            echo "initial_version=true" >> $GITHUB_OUTPUT
          else
            echo "latest_tag=${latest_tag}" >> $GITHUB_OUTPUT
            echo "initial_version=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate changelog
        id: changelog
        shell: bash
        run: |
          if [ "${{ steps.latest_tag.outputs.initial_version }}" = "true" ]; then
            echo "changelog<<EOF" >> $GITHUB_OUTPUT
            echo "Initial release v0.1.0" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            cl=$(git log ${{ steps.latest_tag.outputs.latest_tag }}..HEAD --pretty=format:"- %s%n%b")
            echo "changelog<<EOF" >> $GITHUB_OUTPUT
            echo "$cl" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Determine version bump
        id: semver
        shell: bash
        run: |
          if [ "${{ steps.latest_tag.outputs.initial_version }}" = "true" ]; then
            echo "new_version=v0.1.0" >> $GITHUB_OUTPUT
            echo "version_changed=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          latest=${{ steps.latest_tag.outputs.latest_tag }}
          latest=${latest#v}
          IFS='.' read -r major minor patch <<< "$latest"
          commits=$(git log ${{ steps.latest_tag.outputs.latest_tag }}..HEAD --pretty=format:"%s")
          changed=false
          while IFS= read -r c; do
            if [[ "$c" == *"BREAKING CHANGE:"* ]]; then
              major=$((major+1)); minor=0; patch=0; changed=true; break
            elif [[ "$c" == feat:* || "$c" == feature:* ]]; then
              minor=$((minor+1)); patch=0; changed=true
            elif [[ "$c" == fix:* || "$c" =~ ^[Ff]ix ]]; then
              patch=$((patch+1)); changed=true
            fi
          done <<< "$commits"
          echo "new_version=v${major}.${minor}.${patch}" >> $GITHUB_OUTPUT
          echo "version_changed=$changed" >> $GITHUB_OUTPUT

  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    needs: [version]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type check
        run: npx tsc --noEmit

  test:
    name: Test & Build
    runs-on: ubuntu-latest
    needs: [version, lint-and-typecheck]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate environment configuration
        run: |
          echo "Validating required build configuration..."
          # Check if package.json has required scripts
          if ! grep -q '"build"' package.json; then
            echo "Error: build script not found in package.json"
            exit 1
          fi
          if ! grep -q '"i18n:compile"' package.json; then
            echo "Error: i18n:compile script not found in package.json"
            exit 1
          fi
          echo "✓ Build configuration validated"

      - name: Create .env file from GitHub secrets
        run: |
          echo "Creating .env file from GitHub secrets..."
          cat << EOF > .env
          # Datadog Configuration
          DD_ENV=${{ secrets.DD_ENV || 'production' }}
          DD_VERSION=${{ secrets.DD_VERSION || github.sha }}
          DD_SERVICE=${{ secrets.DD_SERVICE || 'volta-hr-frontend' }}
          DD_TRACE_SAMPLE_RATE=${{ secrets.DD_TRACE_SAMPLE_RATE || '1' }}
          DD_PROFILING_ENABLED=${{ secrets.DD_PROFILING_ENABLED || 'true' }}
          DD_TRACE_DEBUG=${{ secrets.DD_TRACE_DEBUG || 'false' }}
          DD_AGENT_HOST=${{ secrets.DD_AGENT_HOST || 'datadog-agent' }}
          DD_TRACE_AGENT_PORT=${{ secrets.DD_TRACE_AGENT_PORT || '8126' }}
          DD_LOGS_INJECTION=${{ secrets.DD_LOGS_INJECTION || 'true' }}
          DD_APM_ENABLED=${{ secrets.DD_APM_ENABLED || 'true' }}

          # API Configuration
          API_URL=${{ secrets.API_URL || 'http://localhost:8080' }}
          NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL || 'http://localhost:8080' }}

          # Next.js Configuration
          NEXT_TELEMETRY_DISABLED=1
          EOF
          echo "✓ .env file created successfully"
          echo "📝 Environment variables loaded from GitHub secrets"

      - name: Build application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Run tests (when available)
        run: |
          if grep -q '"test"' package.json; then
            npm test -- --coverage --watchAll=false --passWithNoTests
          else
            echo "⚠️  No test script found - skipping tests"
            echo "📝 Tests should be added before production deployment"
          fi
        continue-on-error: true

      - name: Upload coverage reports
        if: hashFiles('coverage/lcov.info') != ''
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage/lcov.info
          flags: unittests
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true

  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    needs: [version]
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"

      - name: Run Semgrep SAST
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/secrets
            p/owasp-top-ten
            p/typescript
            p/react
        continue-on-error: true

  build:
    name: Build & Package Docker Image
    runs-on: infra-linux
    needs: [test, version, security-scan]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      packages: write
      security-events: write

    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-tags: ${{ steps.meta.outputs.tags }}
      image-version: ${{ needs.version.outputs.new_version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create .env file for Docker build
        run: |
          echo "Creating .env file from GitHub secrets for Docker build..."
          cat << EOF > .env
          # Datadog Configuration
          DD_ENV=${{ secrets.DD_ENV || 'production' }}
          DD_SERVICE=${{ secrets.DD_SERVICE || 'volta-hr-frontend' }}
          DD_TRACE_SAMPLE_RATE=${{ secrets.DD_TRACE_SAMPLE_RATE || '1' }}
          DD_PROFILING_ENABLED=${{ secrets.DD_PROFILING_ENABLED || 'true' }}
          DD_TRACE_DEBUG=${{ secrets.DD_TRACE_DEBUG || 'false' }}
          DD_LOGS_INJECTION=${{ secrets.DD_LOGS_INJECTION || 'true' }}
          DD_APM_ENABLED=${{ secrets.DD_APM_ENABLED || 'true' }}

          # API Configuration
          API_URL=${{ secrets.API_URL || 'http://localhost:8080' }}
          NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL || 'http://localhost:8080' }}

          # Next.js Configuration
          NEXT_TELEMETRY_DISABLED=1
          EOF
          echo "✓ .env file created successfully for Docker build"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.version.outputs.new_version }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix={{branch}}-
            type=ref,event=branch
            type=ref,event=pr
          labels: |
            org.opencontainers.image.title=Volta HR
            org.opencontainers.image.description=Multi-tenant Payroll & HR Management System
            org.opencontainers.image.vendor=Dorico Dynamics
            org.opencontainers.image.version=${{ needs.version.outputs.new_version }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.repositoryUrl }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' && needs.version.outputs.version_changed == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ needs.version.outputs.new_version }}
            BUILD_TIME=${{ github.event.head_commit.timestamp }}
            GIT_COMMIT=${{ github.sha }}
            DD_ENV=${{ secrets.DD_ENV || 'production' }}
            DD_SERVICE=${{ secrets.DD_SERVICE || 'volta-hr-frontend' }}
            DD_TRACE_SAMPLE_RATE=${{ secrets.DD_TRACE_SAMPLE_RATE || '1' }}
            DD_PROFILING_ENABLED=${{ secrets.DD_PROFILING_ENABLED || 'true' }}
            DD_TRACE_AGENT_PORT=${{ secrets.DD_TRACE_AGENT_PORT || '8126' }}
            DD_LOGS_INJECTION=${{ secrets.DD_LOGS_INJECTION || 'true' }}
            DD_APM_ENABLED=${{ secrets.DD_APM_ENABLED || 'true' }}
            API_URL=${{ secrets.API_URL || 'http://localhost:8080' }}
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL || 'http://localhost:8080' }}
          sbom: true
          provenance: true

      - name: Generate SBOM
        if: github.event_name != 'pull_request' && needs.version.outputs.version_changed == 'true'
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.version.outputs.new_version }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM artifact
        if: github.event_name != 'pull_request' && needs.version.outputs.version_changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json
          retention-days: 90

  container-scan:
    name: Container Security Scan
    runs-on: ubuntu-latest
    needs: [build, version]
    if: github.event_name != 'pull_request' && needs.version.outputs.version_changed == 'true'
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.image-version }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'container-scan'

      - name: Run Trivy vulnerability scanner (table output)
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.image-version }}
          format: 'table'
          severity: 'CRITICAL,HIGH'

  release:
    name: Create Release
    needs: [version, build, container-scan]
    if: needs.version.outputs.version_changed == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Changelog (if exists)
        id: changelog_update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Only update CHANGELOG.md if it already exists
          if [ -f CHANGELOG.md ]; then
            echo "changelog_exists=true" >> $GITHUB_OUTPUT

            # Get current date
            release_date=$(date +%Y-%m-%d)

            # Create new version section from Unreleased
            sed -i "s/## \[Unreleased\]/## [Unreleased]\n\n### Added\n- None\n\n### Changed\n- None\n\n### Deprecated\n- None\n\n### Removed\n- None\n\n### Fixed\n- None\n\n### Security\n- None\n\n## [${{ needs.version.outputs.new_version }}] - ${release_date}/" CHANGELOG.md

            # Update links at the bottom of the file
            if ! grep -q "\[Unreleased\]:" CHANGELOG.md; then
              echo -e "\n[Unreleased]: https://github.com/${{ github.repository }}/compare/${{ needs.version.outputs.new_version }}...HEAD" >> CHANGELOG.md
              echo "[${{ needs.version.outputs.new_version }}]: https://github.com/${{ github.repository }}/releases/tag/${{ needs.version.outputs.new_version }}" >> CHANGELOG.md
            else
              # Update existing links
              sed -i "/\[Unreleased\]/c\[Unreleased\]: https://github.com/${{ github.repository }}/compare/${{ needs.version.outputs.new_version }}...HEAD" CHANGELOG.md
              sed -i "/^\[${{ needs.version.outputs.new_version }}/d" CHANGELOG.md
              sed -i "/\[Unreleased\]/a\[${{ needs.version.outputs.new_version }}]: https://github.com/${{ github.repository }}/releases/tag/${{ needs.version.outputs.new_version }}" CHANGELOG.md
            fi

            # Configure git with token-based authentication
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git config --global user.name "github-actions[bot]"
            git remote set-url origin https://github-actions[bot]:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
            git add CHANGELOG.md
            git commit -m "docs: update changelog for ${{ needs.version.outputs.new_version }}" || echo "No changes to commit"
            git push || echo "No changes to push"
          else
            echo "changelog_exists=false" >> $GITHUB_OUTPUT
            echo "⚠️  CHANGELOG.md not found - skipping changelog update"
          fi

      - name: Generate Release Notes
        id: release_notes
        run: |
          if [ -f CHANGELOG.md ]; then
            # Extract the current version's changes from CHANGELOG.md
            awk '/^## \[${{ needs.version.outputs.new_version }}\]/{p=1;print;next} /^## \[/{p=0} p{print}' CHANGELOG.md > release_notes.md
          else
            # Generate release notes from git commits
            echo "## What's Changed" > release_notes.md
            echo "" >> release_notes.md
            echo "${{ needs.version.outputs.changelog }}" >> release_notes.md
          fi

          # Append installation and documentation information
          cat << EOF >> release_notes.md

          ## 🐳 Docker Image

          \`\`\`bash
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.version.outputs.new_version }}
          \`\`\`

          ## 📦 Image Details

          - **Registry**: \`${{ env.REGISTRY }}\`
          - **Image**: \`${{ env.IMAGE_NAME }}\`
          - **Version**: \`${{ needs.version.outputs.new_version }}\`
          - **Digest**: \`${{ needs.build.outputs.image-digest }}\`
          - **Platforms**: \`linux/amd64\`, \`linux/arm64\`

          ## 🚀 Deployment

          See the [deployment documentation](https://github.com/${{ github.repository }}/blob/main/README.md) for deployment instructions.

          ## 🔒 Security

          This release has been scanned for vulnerabilities using Trivy and CodeQL.
          View the [Security tab](https://github.com/${{ github.repository }}/security) for details.
          EOF

      - name: Create Git Tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git remote set-url origin https://github-actions[bot]:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
          git tag -a ${{ needs.version.outputs.new_version }} -m "Release ${{ needs.version.outputs.new_version }}"
          git push origin ${{ needs.version.outputs.new_version }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.new_version }}
          name: Release ${{ needs.version.outputs.new_version }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download SBOM artifact
        if: needs.build.outputs.image-version != ''
        uses: actions/download-artifact@v4
        with:
          name: sbom
          path: ./sbom

      - name: Attach SBOM to Release
        if: needs.build.outputs.image-version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.new_version }}
          files: ./sbom/sbom.spdx.json
          token: ${{ secrets.GITHUB_TOKEN }}

  notify:
    name: Notify Deployment Ready
    needs: [release, version]
    if: github.ref == 'refs/heads/main' && needs.version.outputs.version_changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Deployment readiness notification
        run: |
          echo "🎉 Release ${{ needs.version.outputs.new_version }} is ready for deployment!"
          echo ""
          echo "📦 Docker Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.version.outputs.new_version }}"
          echo ""
          echo "🚀 Next Steps:"
          echo "  1. Review the release notes: https://github.com/${{ github.repository }}/releases/tag/${{ needs.version.outputs.new_version }}"
          echo "  2. Deploy using your preferred method (ArgoCD, Kubernetes, Docker Compose, etc.)"
          echo "  3. Verify the deployment health check: http://your-domain/api/health"
          echo ""
          echo "⚠️  Note: Automatic deployment is disabled. Deploy manually when ready."

      # Uncomment and configure when deploy.yml workflow is created
      # - name: Dispatch deploy workflow with tag
      #   uses: actions/github-script@v8
      #   with:
      #     github-token: ${{ secrets.GITHUB_TOKEN }}
      #     script: |
      #       await github.rest.actions.createWorkflowDispatch({
      #         owner: context.repo.owner,
      #         repo: context.repo.repo,
      #         workflow_id: 'deploy.yml',
      #         ref: 'main',
      #         inputs: {
      #           tag: '${{ needs.version.outputs.new_version }}',
      #           environment: 'production'
      #         }
      #       });
